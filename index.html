<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>От студента до миллионера</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <nav class="menu">
            <a href="index.html" class="active">Игра</a>
            <a href="guide.html">Как играть</a>
            <a href="endings.html">Финалы</a>
        </nav>

        <header class="header">
            <h1>От студента до миллионера</h1>
            <p>Принимай решения и попробуй привести героя к успеху</p>
        </header>

        <section class="game-card">
            <img id="scene-image" src="images/start.jpg" alt="Ситуация">

            <div class="game-info">
                <section class="stats">
<div class="stat">
    <span>Деньги</span>

    <div class="stat-line">
        <strong id="money">100</strong>
        <small id="money-change"></small>
    </div>
</div>
<div class="stat">
    <span>Энергия</span>

    <div class="stat-line">
        <strong id="energy">100</strong>
        <small id="energy-change"></small>
    </div>
</div>
<div class="stat">
    <span>Репутация</span>

    <div class="stat-line">
        <strong id="reputation">0</strong>
        <small id="reputation-change"></small>
    </div>
</div>
                </section>

                <h2 id="scene-title">Начало пути</h2>

                <p id="scene-text">
                    Ты обычный студент. Денег немного, энергии хватает, но хочется добиться большего.
                    Какой первый шаг выберешь?
                </p>

                <div id="choices" class="choices">
                    <button>Учиться и развивать навыки</button>
                    <button>Пойти на подработку</button>
                    <button>Попробовать открыть бизнес</button>
                </div>
            </div>
        </section>

        <button id="restart-btn" class="restart-btn">Начать заново</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
