<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Путь к успеху</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">Путь к успеху: от студента до магната</h1>

        <div class="top-section">
            <div class="image-block">
                <img id="scene-image" src="images/start.jpg" alt="Сцена игры">
            </div>

<div class="stats-panel">
    <div class="stat-box" id="money-box">
        <span class="stat-label">💰 Деньги</span>
        <span id="money" class="stat-value">100</span>
    </div>

    <div class="stat-box" id="energy-box">
        <span class="stat-label">⚡ Энергия</span>
        <span id="energy" class="stat-value">100</span>
    </div>

    <div class="stat-box" id="reputation-box">
        <span class="stat-label">⭐ Репутация</span>
        <span id="reputation" class="stat-value">0</span>
    </div>
</div>
        </div>

        <div class="story-block">
            <h2 id="scene-title">Обычный день, необычные амбиции</h2>

            <p id="scene-text">
                Ты обычный студент. Денег немного, амбиций много, а планов ещё больше.
                Пора что-то менять и начинать путь к успеху.
            </p>
        </div>

        <div id="choices" class="choices">
            <button class="choice-btn">Учиться и развивать навыки</button>
            <button class="choice-btn">Пойти работать и зарабатывать</button>
            <button class="choice-btn">Запустить “гениальную бизнес-идею”</button>
        </div>

        <button id="restart-btn" class="restart-btn">Начать заново</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
